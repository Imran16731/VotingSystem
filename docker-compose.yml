services:

  frontend:
    build:
      context: ./frontend

    container_name: voting_frontend_new

    ports:
      - "8080:80"

    depends_on:
      - backend


  backend:
    build:
      context: ./backend

    container_name: voting_backend

    ports:
      - "5273:8080"

    depends_on:
      db:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Development


  db:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: voting_sqlserver

    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong@Pass123"

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Pass123' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s


volumes:
  sql_data: