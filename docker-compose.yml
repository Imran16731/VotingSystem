version: '3.9'

services:

  backend:
    build:
      context: ./backend
    container_name: voting_backend

    ports:
      - "5273:8080"

    depends_on:
      - db

    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: voting_sqlserver

    environment:
      SA_PASSWORD: "YourStrong@Pass123"
      ACCEPT_EULA: "Y"

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

volumes:
  sql_data: